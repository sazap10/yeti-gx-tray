# Rust itself comes from pacman (cargo/rustc already installed); mise drives the workflow.
[tasks.build]
description = "Release build"
run = "cargo build --release"

[tasks.test]
description = "Unit tests"
run = "cargo test"

[tasks.lint]
description = "Clippy, warnings are errors"
run = "cargo clippy --all-targets -- -D warnings"

[tasks.check]
description = "Lint + test + release build"
depends = ["lint", "test", "build"]

[tasks.run]
description = "Run the tray from the release build"
depends = ["build"]
run = "target/release/yeti-gx-tray"

[tasks.listen]
description = "Print raw HID++ reports from the mic (--listen)"
depends = ["build"]
run = "target/release/yeti-gx-tray --listen"

[tasks.install]
description = "Install binary + autostart entry into $HOME (user-run only). YETI_FG=#rrggbb pins the digit colour."
depends = ["build"]
# The autostart entry gets the binary's absolute path: Plasma launches autostart entries as
# systemd user units, whose PATH does not include ~/.local/bin.
run = """
set -eu
bin="$HOME/.local/bin/yeti-gx-tray"
autostart="${XDG_CONFIG_HOME:-$HOME/.config}/autostart"
fg="${YETI_FG:-}"
install -Dm755 target/release/yeti-gx-tray "$bin"
mkdir -p "$autostart"
sed "s|^Exec=.*|Exec=\\"$bin\\"${fg:+ --fg ${fg#\\#}}|" yeti-gx-tray.desktop > "$autostart/yeti-gx-tray.desktop"
echo "installed $bin and $autostart/yeti-gx-tray.desktop"
"""
